<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toolbox Talk 2026 - Mobile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --primary: #004085; 
            --bg: #f8f9fa; 
            --border: #ccc;
            --danger: #d93025;
            --accent: #e67e22;
            --success: #28a745;
        }
        
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 10px; background: var(--bg); color: #333; 
        }

        /* Sekcja ustawień - Mobile Friendly */
        .no-print { 
            background: #fff; padding: 15px; border-radius: 12px; 
            margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .section-title { font-weight: bold; color: var(--primary); margin-bottom: 10px; font-size: 14px; text-transform: uppercase; }

        /* Grid miesięcy - 3 kolumny na mobile */
        .months-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; margin-bottom: 15px; 
        }
        .m-btn { 
            background: #fff; border: 1px solid var(--border); padding: 10px 5px; 
            cursor: pointer; text-align: center; font-size: 11px; font-weight: bold; border-radius: 8px;
        }
        .m-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* Panel sterowania */
        .controls-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; color: #666; font-weight: bold; }
        input[type="text"], input[type="number"] { 
            padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; 
        }

        /* Lista projektów (scrollowalna) */
        .filter-box { 
            border: 1px solid var(--border); border-radius: 8px; padding: 8px; 
            max-height: 150px; overflow-y: auto; background: #fafafa; margin-bottom: 10px;
        }
        .filter-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px; }

        /* Tabela z przewijaniem bocznym */
        .table-container { 
            width: 100%; overflow-x: auto; background: #fff; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        #printableArea { min-width: 800px; padding: 10px; background: white; }
        
        header { text-align: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #444; padding: 8px 4px; text-align: center; font-size: 12px; }
        th { background: #f0f0f0; }

        .col-proj { text-align: left; min-width: 180px; font-weight: bold; position: sticky; left: 0; background: white; z-index: 10; }
        .row-de { background-color: #f2f6ff !important; }
        
        /* Styl pól wpisywania - duży tekst, łatwe klikanie */
        .cell-input { 
            width: 45px; height: 35px; border: 1px solid #ddd; border-radius: 4px; 
            text-align: center; font-weight: bold; font-size: 16px; background: #fff;
        }
        .cell-zero { background-color: #ffdce0 !important; color: #b21f2d; }

        .btn-main { 
            width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 8px;
            font-weight: bold; color: white; cursor: pointer; font-size: 14px;
        }
        .btn-save { background: #333; }
        .btn-pdf { background: var(--accent); }
        .btn-add { background: var(--success); }

        @media print { .no-print { display: none; } #printableArea { min-width: 100%; } }
    </style>
</head>
<body>

<div class="no-print">
    <div class="section-title">Wybierz Miesiąc:</div>
    <div class="months-grid" id="monthNav"></div>
    
    <div class="controls-row">
        <div class="input-group">
            <label>Start (Rzymskie):</label>
            <input type="text" id="startRoman" oninput="updateConfig()">
        </div>
        <div class="input-group">
            <label>Ilość spotkań:</label>
            <input type="number" id="colCount" oninput="updateConfig()">
        </div>
    </div>

    <div class="section-title">Budowy:</div>
    <div class="filter-box" id="projectFilterList"></div>
    
    <div class="controls-row">
        <input type="text" id="newProj" placeholder="Nazwa nowej budowy..." style="flex:2">
        <button class="btn-main btn-add" onclick="addProject()" style="flex:1; margin:0">DODAJ</button>
    </div>

    <button class="btn-main btn-save" onclick="saveData()">ZAPISZ DANE</button>
    <button class="btn-main btn-pdf" onclick="generatePDF()">POBIERZ PDF (A3)</button>
</div>

<div class="table-container">
    <div id="printableArea">
        <header>
            <div style="font-size: 18px; font-weight: 900;">TOOLBOX TALK 2026</div>
            <div id="monthLabel" style="font-size: 14px; font-weight: bold; margin-top: 5px; color: var(--primary);"></div>
        </header>

        <table id="mainTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const months = [
        {pl: "Styczeń", de: "Januar"}, {pl: "Luty", de: "Februar"}, {pl: "Marzec", de: "März"},
        {pl: "Kwiecień", de: "April"}, {pl: "Maj", de: "Mai"}, {pl: "Czerwiec", de: "Juni"},
        {pl: "Lipiec", de: "Juli"}, {pl: "Sierpień", de: "August"}, {pl: "Wrzesień", de: "September"},
        {pl: "Październik", de: "Oktober"}, {pl: "Listopad", de: "November"}, {pl: "Grudzień", de: "Dezember"}
    ];

    let db = JSON.parse(localStorage.getItem('toolbox_2026_v1')) || {
        projects: ["BLP SE", "Equinor kabel", "SE Leszno", "SE Polkowice", "Stade [DE]", "UW Semlin [DE]"],
        selectedProjects: ["BLP SE", "Equinor kabel", "SE Leszno", "SE Polkowice", "Stade [DE]", "UW Semlin [DE]"],
        monthsData: {}
    };

    let curM = new Date().getMonth();

    function init() {
        const nav = document.getElementById('monthNav');
        nav.innerHTML = '';
        months.forEach((m, i) => {
            const b = document.createElement('div');
            b.className = `m-btn ${i === curM ? 'active' : ''}`;
            b.textContent = m.pl.toUpperCase();
            b.onclick = () => { curM = i; sync(); };
            nav.appendChild(b);
        });
        sync();
    }

    function sync() {
        if (!db.monthsData[curM]) {
            db.monthsData[curM] = { startR: "I", count: 4, dates: [], values: {} };
        }
        document.getElementById('startRoman').value = db.monthsData[curM].startR;
        document.getElementById('colCount').value = db.monthsData[curM].count;
        renderFilter();
        render();
    }

    function renderFilter() {
        const container = document.getElementById('projectFilterList');
        container.innerHTML = '';
        db.projects.forEach(name => {
            const div = document.createElement('div');
            div.className = 'filter-item';
            const isChecked = db.selectedProjects.includes(name);
            div.innerHTML = `<input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleProject('${name}')"> <span>${name}</span>`;
            container.appendChild(div);
        });
    }

    function toggleProject(name) {
        const idx = db.selectedProjects.indexOf(name);
        if (idx > -1) db.selectedProjects.splice(idx, 1);
        else db.selectedProjects.push(name);
        render();
    }

    function updateConfig() {
        db.monthsData[curM].startR = document.getElementById('startRoman').value.toUpperCase() || "I";
        db.monthsData[curM].count = parseInt(document.getElementById('colCount').value) || 1;
        render();
    }

    function romanToInt(s) {
        const map = {I:1, V:5, X:10, L:50, C:100};
        let res = 0; s = s.toUpperCase();
        for(let i=0; i<s.length; i++) {
            const cur = map[s[i]]; const next = map[s[i+1]];
            if(next > cur) { res += next - cur; i++; } else res += cur;
        }
        return res || 1;
    }

    function intToRoman(num) {
        const lookup = {X:10,IX:9,V:5,IV:4,I:1};
        let roman = '';
        for (let i in lookup) { while (num >= lookup[i]) { roman += i; num -= lookup[i]; } }
        return roman;
    }

    function render() {
        const mData = db.monthsData[curM];
        document.getElementById('monthLabel').textContent = `${months[curM].pl.toUpperCase()} 2026`;
        const head = document.getElementById('tableHead');
        const body = document.getElementById('tableBody');
        const startInt = romanToInt(mData.startR);

        let h1 = `<tr><th rowspan="2">LP</th><th rowspan="2" class="col-proj">PROJEKT</th>`;
        let h2 = `<tr>`;
        for(let i=0; i<mData.count; i++) {
            h1 += `<th>${intToRoman(startInt + i)}</th>`;
            h2 += `<th><input type="text" placeholder="Data" style="width:40px;font-size:9px;border:none" value="${mData.dates[i] || ''}" onchange="db.monthsData[${curM}].dates[${i}]=this.value"></th>`;
        }
        h1 += `<th>SUMA</th><th>YTD</th></tr>`;
        h2 += `</tr>`;
        head.innerHTML = h1 + h2;

        body.innerHTML = '';
        let lp = 1;
        db.projects.forEach((name) => {
            if (!db.selectedProjects.includes(name)) return;
            const tr = document.createElement('tr');
            if(name.includes('[DE]')) tr.className = 'row-de';

            const rowVals = mData.values[name] || Array(mData.count).fill('');
            let mSum = rowVals.reduce((a, b) => a + (parseFloat(b) || 0), 0);
            let cSum = calculateCum(name, curM, mSum);

            let rowHtml = `<td>${lp++}</td><td class="col-proj">${name}</td>`;
            for(let i=0; i<mData.count; i++) {
                const val = rowVals[i] || '';
                rowHtml += `<td><input type="text" inputmode="numeric" class="cell-input ${val === '0' ? 'cell-zero' : ''}" value="${val}" oninput="updateCell('${name}', ${i}, this.value)"></td>`;
            }
            rowHtml += `<td style="font-weight:bold">${mSum || ''}</td><td style="color:var(--primary); font-weight:bold">${cSum || ''}</td>`;
            tr.innerHTML = rowHtml;
            body.appendChild(tr);
        });
    }

    function updateCell(proj, cIdx, val) {
        if(!db.monthsData[curM].values[proj]) db.monthsData[curM].values[proj] = [];
        db.monthsData[curM].values[proj][cIdx] = val;
        // Re-render bez przeładowania całego widoku dla płynności
        render(); 
    }

    function calculateCum(proj, mIdx, curSum) {
        let total = 0;
        for(let i=0; i<mIdx; i++) {
            if(db.monthsData[i] && db.monthsData[i].values[proj]) {
                const prevMonthVals = db.monthsData[i].values[proj];
                total += prevMonthVals.reduce((a, b) => a + (parseFloat(b) || 0), 0);
            }
        }
        return total + curSum;
    }

    function addProject() {
        const input = document.getElementById('newProj');
        if(input.value) { 
            db.projects.push(input.value); 
            db.selectedProjects.push(input.value);
            input.value = ''; renderFilter(); render(); 
        }
    }

    function saveData() {
        localStorage.setItem('toolbox_2026_v1', JSON.stringify(db));
        alert("Zapisano!");
    }

    function generatePDF() {
        const area = document.getElementById('printableArea');
        html2canvas(area, { scale: 2 }).then(canvas => {
            const pdf = new jspdf.jsPDF('l', 'mm', 'a3');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 10, 400, 0);
            pdf.save(`Toolbox_2026_${curM+1}.pdf`);
        });
    }

    init();
</script>
</body>
</html>
